<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>今夜の一杯スロット</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@500;700&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060a; --text:#f6f1ea; --muted:#a49c93; --glass:rgba(255,255,255,.06); --glass-line:rgba(255,255,255,.12);
  --accent:#f5b83d; --accent2:#ffdf8a; --ink:#2b1a03; --glow:rgba(245,184,61,.55);
  --body1:#3a2a14; --body2:#120c05;
  --cell:58px;
}
body[data-m="beer"]{ --accent:#f5b83d; --accent2:#ffe39a; --ink:#2b1a03; --glow:rgba(245,184,61,.55); --body1:#3d2a10; --body2:#120b03; }
body[data-m="sake"]{ --accent:#8fb8ff; --accent2:#d9e6ff; --ink:#071631; --glow:rgba(120,165,255,.55); --body1:#15223f; --body2:#050915; }
body[data-m="wine"]{ --accent:#ff6b8b; --accent2:#ffd0da; --ink:#2d0510; --glow:rgba(255,90,130,.55); --body1:#3d0d1c; --body2:#120207; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%; background:var(--bg)}
body{
  color:var(--text); font-family:"Noto Sans JP",system-ui,sans-serif; overflow-x:hidden;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,170,60,.18) 0 40px, transparent 90px),
    radial-gradient(circle at 85% 12%, rgba(255,120,80,.14) 0 30px, transparent 80px),
    radial-gradient(circle at 70% 40%, rgba(120,160,255,.10) 0 50px, transparent 110px),
    radial-gradient(circle at 20% 70%, rgba(255,200,120,.10) 0 60px, transparent 130px),
    radial-gradient(ellipse at 50% 0%, #241a12 0%, #07060a 65%);
  background-attachment:fixed;
}
button{font:inherit; color:inherit}
.screen{display:none; min-height:100svh}
.screen.active{display:block}
.wrap{max-width:460px; margin:0 auto; padding:max(18px, env(safe-area-inset-top)) 16px 32px}

/* ===== 質問 ===== */
.brand{display:flex; align-items:center; justify-content:center; gap:8px; margin:6px 0 2px; font-family:Oswald,sans-serif; letter-spacing:.28em; font-size:12px; color:var(--muted)}
.brand i{width:22px; height:1px; background:var(--muted); opacity:.5}
.qtitle{font-size:26px; font-weight:900; text-align:center; margin:6px 0 4px; letter-spacing:.04em}
.qsub{font-size:13px; color:var(--muted); text-align:center; margin:0 0 20px}
.progress{display:flex; gap:6px; margin:18px 0 22px}
.progress span{flex:1; height:4px; border-radius:4px; background:rgba(255,255,255,.12); overflow:hidden; position:relative}
.progress span.on::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg,#f5b83d,#ff6b8b,#8fb8ff)}
.qstep{animation:slide .45s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{opacity:0; transform:translateX(24px)} to{opacity:1; transform:none}}
.qnum{font-family:Oswald,sans-serif; font-size:13px; letter-spacing:.2em; color:var(--muted)}
.qtext{font-size:22px; font-weight:700; margin:4px 0 16px}
.opts{display:grid; gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{
  position:relative; display:flex; align-items:center; gap:14px; padding:14px; width:100%; text-align:left;
  border-radius:18px; border:1px solid var(--glass-line); background:var(--glass);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); cursor:pointer;
  transition:transform .15s, border-color .2s, background .2s;
}
.opt:active{transform:scale(.97)}
.opt:hover{border-color:rgba(255,255,255,.3)}
.opt .ic{width:62px; height:62px; flex:none; border-radius:14px; display:grid; place-items:center; background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.16), rgba(255,255,255,.02))}
.opt .ic svg{width:50px; height:50px}
.opt .t{font-size:18px; font-weight:700}
.opt .d{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.5}
.opts.two .opt{flex-direction:column; text-align:center; padding:18px 10px}
.opt .emo{font-size:30px}
.opt.c-beer{background:linear-gradient(135deg, rgba(245,184,61,.22), rgba(245,184,61,.04))}
.opt.c-sake{background:linear-gradient(135deg, rgba(120,165,255,.22), rgba(120,165,255,.04))}
.opt.c-wine{background:linear-gradient(135deg, rgba(255,90,130,.22), rgba(255,90,130,.04))}
.qback{display:block; margin:18px auto 0; background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer}

/* ===== 台の決定 ===== */
.decide{text-align:center; padding-top:8vh}
.decide .lead{color:var(--muted); font-size:14px; letter-spacing:.1em}
.decide .mname{font-size:34px; font-weight:900; margin:6px 0 4px; color:var(--accent); text-shadow:0 0 24px var(--glow)}
.decide .tags{display:flex; justify-content:center; gap:8px; margin:10px 0 26px}
.tag{font-size:12px; padding:5px 12px; border-radius:999px; border:1px solid var(--glass-line); background:var(--glass)}
.preview{display:flex; justify-content:center; gap:10px; margin:0 auto 30px}
.preview div{width:76px; height:76px; border-radius:16px; display:grid; place-items:center; background:linear-gradient(180deg,#fbf6ec,#e2d8c6); box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.2) inset; animation:float 3s ease-in-out infinite}
.preview div:nth-child(2){animation-delay:.3s} .preview div:nth-child(3){animation-delay:.6s}
.preview svg{width:58px; height:58px}
@keyframes float{50%{transform:translateY(-8px)}}
.cta{
  display:block; width:100%; padding:18px; border:none; border-radius:16px; cursor:pointer;
  font-size:17px; font-weight:900; letter-spacing:.12em; color:var(--ink);
  background:linear-gradient(180deg,var(--accent2),var(--accent)); box-shadow:0 10px 30px var(--glow);
}
.cta:active{transform:scale(.98)}

/* ===== スロット台（一人称視点） ===== */
#s-play .wrap{padding-top:max(10px, env(safe-area-inset-top)); padding-bottom:20px}
.topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px}
.topbar button{background:var(--glass); border:1px solid var(--glass-line); border-radius:999px; padding:7px 14px; font-size:12px; cursor:pointer; color:var(--text)}
.scene{perspective:1100px}
.enter{animation:approach 1.1s cubic-bezier(.2,.75,.2,1)}
@keyframes approach{from{transform:translateY(60px) scale(.62); filter:blur(8px) brightness(.4); opacity:.3} to{transform:none; filter:none; opacity:1}}
.cabinet{
  position:relative; border-radius:30px 30px 18px 18px; padding:12px 12px 0;
  background:linear-gradient(180deg, var(--body1), var(--body2) 70%);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.08) inset,
    0 0 0 1px #000,
    0 30px 60px rgba(0,0,0,.7),
    0 0 50px var(--glow);
}
.cabinet::before{ /* 側面のクロームライン */
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(90deg, rgba(255,255,255,.18), transparent 6%, transparent 94%, rgba(255,255,255,.12));
}
/* 大型モニター（リールはモニターの下部に重なる） */
.cabinet{--monH:min(48svh, 420px); --ov:calc(var(--monH) * .24)}
.monitor{
  position:relative; height:var(--monH); border-radius:22px; padding:5px; background:#000; overflow:hidden;
  box-shadow:0 0 0 2px #34343a, 0 0 0 3px rgba(255,255,255,.14), 0 6px 18px rgba(0,0,0,.6);
}
#mc{position:absolute; inset:5px; width:calc(100% - 10px); height:calc(100% - 10px); border-radius:18px; display:block}
.monitor::after{content:""; position:absolute; inset:5px; border-radius:18px; pointer-events:none;
  background:linear-gradient(165deg, rgba(255,255,255,.16), transparent 32%), radial-gradient(ellipse at 50% 120%, transparent 60%, rgba(0,0,0,.5));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 0 40px rgba(0,0,0,.6)}
.mon-ui,.lcd{display:none !important}
.mon-ui{position:absolute; left:0; right:0; top:18px; text-align:center; pointer-events:none; transition:opacity .25s}
.logo{font-family:Oswald,sans-serif; font-weight:700; font-size:44px; letter-spacing:.14em; line-height:1;
  background:linear-gradient(180deg,#fff, var(--accent2) 40%, var(--accent) 60%, #fff 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 12px var(--glow)) drop-shadow(0 2px 0 rgba(0,0,0,.7));
}
.logo-sub{font-size:11px; letter-spacing:.4em; color:var(--accent2); margin-top:6px; opacity:.9; text-shadow:0 1px 4px rgba(0,0,0,.8)}
.leds{position:absolute; left:20px; right:20px; top:9px; display:flex; justify-content:space-between; pointer-events:none}
.leds i{width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px var(--accent); opacity:.25; animation:chase 1.4s linear infinite}
@keyframes chase{0%,30%{opacity:1} 60%,100%{opacity:.2}}
.cabinet.fever .leds i{animation-duration:.35s}
.monitor.live .mon-ui,.monitor.live .lcd{opacity:0}
.lcd{
  position:absolute; left:50%; transform:translateX(-50%); top:86px;
  min-width:62%; max-width:88%; padding:0 16px; height:34px; border-radius:999px; display:flex; align-items:center; justify-content:center; white-space:nowrap;
  font-weight:700; font-size:14px; letter-spacing:.1em; color:#fff; transition:opacity .25s;
  text-shadow:0 0 10px var(--glow), 0 1px 2px rgba(0,0,0,.8);
  background:linear-gradient(90deg, transparent, rgba(0,0,0,.6) 18%, rgba(0,0,0,.6) 82%, transparent);
  border-top:1px solid rgba(255,255,255,.18); border-bottom:1px solid rgba(255,255,255,.18);
}
.lcd.blink{animation:blink .45s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.bezel{
  position:relative; z-index:2; margin:calc(-1 * var(--ov)) -28px 0; padding:7px; border-radius:6px;
  background:linear-gradient(180deg,#f2f2f2,#8d8d8d 18%,#dcdcdc 50%,#6f6f6f 82%,#c9c9c9);
  box-shadow:0 6px 14px rgba(0,0,0,.6);
}
.reels{position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:5px; padding:5px; border-radius:10px; background:#0a0a0a}
.reel{position:relative; height:calc(var(--cell) * 3); overflow:hidden; border-radius:6px; background:#fff}
.strip{position:absolute; left:0; right:0; top:0; will-change:transform}
.strip.fast{filter:blur(1.4px) saturate(1.2)}
.cell{height:var(--cell); display:grid; place-items:center}
.cell svg{width:78%; height:78%; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.cell{overflow:hidden}
.cell img{width:92%; height:calc(var(--cell) * .86); object-fit:contain; border-radius:4px; display:block; -webkit-user-drag:none; user-select:none}
.cell.win img{animation:winpulse .5s ease-in-out infinite alternate}
.r-hero{background:#fff !important}
.r-hero img{width:112px; height:112px; object-fit:contain}
.preview div{background:#fff !important; overflow:hidden}
.preview img{width:64px; height:64px; object-fit:contain}
.opt .ic{background:#fff !important}
.opt .ic{overflow:hidden}
.opt .ic img{width:54px; height:54px; object-fit:contain}
.pay-row .ic{background:#fff !important; overflow:hidden}
.pay-row .ic img{width:40px; height:40px; object-fit:contain}
.cell.win svg{animation:winpulse .5s ease-in-out infinite alternate}
@keyframes winpulse{to{transform:scale(1.14); filter:drop-shadow(0 0 10px #ffd34d) drop-shadow(0 0 2px #fff)}}
.reel::after{ /* 円筒の陰影 */
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.08) 26%, transparent 40%, transparent 60%, rgba(0,0,0,.08) 74%, rgba(0,0,0,.55) 100%);
}
.glass{position:absolute; inset:7px; border-radius:8px; pointer-events:none;
  background:linear-gradient(160deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.04) 30%, transparent 55%, rgba(255,255,255,.06) 85%);
}
.payline{position:absolute; left:7px; right:7px; top:calc(12px + var(--cell)); height:var(--cell); pointer-events:none;
  border-top:2px solid rgba(230,40,40,.55); border-bottom:2px solid rgba(230,40,40,.55)}
.payline::before,.payline::after{content:""; position:absolute; top:50%; width:0; height:0; border:8px solid transparent; transform:translateY(-50%)}
.payline::before{left:-13px; border-left-color:#ff3b30; filter:drop-shadow(0 0 4px #ff3b30)}
.payline::after{right:-13px; border-right-color:#ff3b30; filter:drop-shadow(0 0 4px #ff3b30)}
.cabinet.win .payline{border-color:#ffd34d; box-shadow:0 0 18px #ffd34d, inset 0 0 18px rgba(255,211,77,.5); animation:blink .3s steps(2) infinite}
.reel.reach{box-shadow:0 0 0 3px #ff3b30, 0 0 20px #ff3b30; animation:reachglow .3s infinite alternate}
@keyframes reachglow{to{box-shadow:0 0 0 3px #ffd60a, 0 0 26px #ffd60a}}
.cabinet.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}}

/* 操作パネル（手前に傾けて一人称視点に） */
.deck{
  margin:14px -12px 0; padding:18px 16px 22px; border-radius:0 0 18px 18px;
  transform-origin:top center; transform:rotateX(24deg);
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px),
    linear-gradient(180deg,#2b2b30,#141417);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18), 0 24px 40px rgba(0,0,0,.6);
}
.stops{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 4px}
.stops .btn3d{height:50px; font-size:13px}
.btn3d{
  position:relative; height:58px; border-radius:14px; border:none; cursor:pointer;
  font-family:Oswald,sans-serif; font-weight:700; letter-spacing:.14em; font-size:15px;
  color:#5b5b5b; background:linear-gradient(180deg,#4a4a50,#2c2c31);
  box-shadow:0 7px 0 #0b0b0d, 0 10px 16px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .06s, box-shadow .06s, background .2s, color .2s;
}
.btn3d.live{color:#2a0d00; background:radial-gradient(circle at 50% 30%, #fff1c7, #ffb02e 60%, #e07a00); box-shadow:0 7px 0 #7a3c00, 0 10px 22px rgba(255,160,40,.6), inset 0 1px 0 rgba(255,255,255,.7)}
.btn3d.live.stop{background:radial-gradient(circle at 50% 30%, #ffd9d9, #ff4b4b 60%, #b80f0f); color:#fff; box-shadow:0 7px 0 #600, 0 10px 22px rgba(255,60,60,.6), inset 0 1px 0 rgba(255,255,255,.6); text-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn3d.press{transform:translateY(6px); box-shadow:0 1px 0 #0b0b0d, 0 3px 6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.2)}
.btn3d:disabled{cursor:default}
.startrow{display:flex; align-items:center; gap:14px; margin-top:22px; padding:0 8px}
.start{flex:1; height:64px; border-radius:32px; font-size:20px}
.credit{font-family:Oswald,sans-serif; font-size:11px; color:var(--muted); letter-spacing:.16em; text-align:center; line-height:1.3}
.credit b{display:block; color:#ffd36e; font-size:20px; text-shadow:0 0 8px rgba(255,190,60,.8)}
.hint{text-align:center; color:var(--muted); font-size:12px; margin-top:16px}

/* ===== リーチ演出 ===== */
#reach{position:fixed; z-index:30; display:none; background:#000; overflow:hidden; box-shadow:0 0 50px var(--glow)}
#reach.show{display:block}
#reach canvas,#reach video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
#reach .skip{opacity:0; transition:opacity .3s; position:absolute; right:16px; bottom:max(20px, env(safe-area-inset-bottom)); font-size:12px; color:rgba(255,255,255,.6); letter-spacing:.1em}

/* ===== 結果 ===== */
.overlay{position:fixed; inset:0; z-index:20; display:none; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.overlay.show{display:flex}
.card{
  width:100%; max-width:460px; max-height:92svh; overflow:auto; padding:22px 18px max(20px, env(safe-area-inset-bottom));
  border-radius:28px 28px 0 0; background:linear-gradient(180deg, rgba(40,34,30,.96), rgba(16,13,12,.98));
  border-top:1px solid rgba(255,255,255,.18); box-shadow:0 -20px 60px rgba(0,0,0,.6);
  animation:up .5s cubic-bezier(.2,.9,.25,1.05); text-align:center;
}
@keyframes up{from{transform:translateY(100%)} to{transform:none}}
.grab{width:40px; height:4px; border-radius:4px; background:rgba(255,255,255,.25); margin:-8px auto 14px}
.r-label{font-family:Oswald,sans-serif; font-size:12px; letter-spacing:.3em; color:var(--accent)}
.r-hero{width:132px; height:132px; margin:10px auto 6px; border-radius:30px; display:grid; place-items:center;
  background:linear-gradient(180deg,#fbf6ec,#e0d5c1); box-shadow:0 14px 40px rgba(0,0,0,.6), 0 0 40px var(--glow)}
.r-hero svg{width:104px; height:104px}
.r-name{font-size:26px; font-weight:900; margin:8px 0 2px}
.r-taste{display:inline-block; font-size:11px; padding:3px 10px; border-radius:999px; background:var(--accent); color:var(--ink); font-weight:700}
.r-desc{font-size:14px; line-height:1.8; color:#ddd3c7; margin:12px 4px 14px}
.r-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; text-align:left}
.r-box{padding:12px; border-radius:14px; background:var(--glass); border:1px solid var(--glass-line)}
.r-box .k{font-size:11px; color:var(--muted)}
.r-box .v{font-size:15px; font-weight:700; margin-top:4px; line-height:1.4}
.r-msg{margin:12px 0 0; padding:14px; border-radius:14px; font-size:14px; line-height:1.7; background:linear-gradient(135deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border:1px solid var(--glass-line)}
.r-msg small{display:block; font-size:11px; color:var(--muted); margin-bottom:4px}
.r-staff{font-size:12px; color:var(--muted); margin:14px 0}
.r-btns{display:grid; grid-template-columns:1fr 1.3fr; gap:10px}
.r-btns button{padding:15px; border-radius:14px; font-weight:700; font-size:15px; cursor:pointer}
.b-sec{background:transparent; border:1px solid var(--glass-line)}
.b-pri{border:none; color:var(--ink); background:linear-gradient(180deg,var(--accent2),var(--accent))}
.card.rare{background:linear-gradient(180deg, #3b2b0c, #120c02)}
.card.rare .r-hero{box-shadow:0 0 0 2px #ffd34d, 0 0 60px rgba(255,211,77,.8)}
.card.rare .r-name{background:linear-gradient(180deg,#fff7cf,#ffd34d,#c28a12); -webkit-background-clip:text; background-clip:text; color:transparent}

/* 絵柄表 */
.pay{display:grid; gap:8px; text-align:left; margin-top:10px}
.pay-row{display:flex; align-items:center; gap:12px; padding:8px 10px; border-radius:12px; background:var(--glass); border:1px solid var(--glass-line)}
.pay-row .ic{width:46px; height:46px; border-radius:10px; display:grid; place-items:center; background:linear-gradient(180deg,#fbf6ec,#e0d5c1); flex:none}
.pay-row .ic svg{width:38px; height:38px}
.pay-row .three{display:flex; gap:2px}
.pay-row .nm{font-size:14px; font-weight:700}
.pay-row .tg{font-size:11px; color:var(--muted)}
.pay-row.mine{border-color:var(--accent)}

.sparkle{position:fixed; z-index:40; pointer-events:none; width:10px; height:16px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#reach.full .skip{opacity:1}

/* ===== 台：画面の横幅いっぱい。モニターとリールの画面幅をそろえる ===== */
#s-play .wrap{padding-left:0; padding-right:0; max-width:520px}
#s-play .topbar{padding:0 12px}
.topbar{justify-content:flex-start}
.cabinet{border-radius:0; padding:0;
  background:linear-gradient(90deg,#0c0c0e,#2a2a30 3%,#18181c 8%,#18181c 92%,#2a2a30 97%,#0c0c0e), linear-gradient(180deg, var(--body1), var(--body2));
}
.cabinet::before{display:none}
.monitor{border-radius:0; padding:0; background:linear-gradient(180deg,#3a3a40,#121214);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25), inset 0 -2px 0 rgba(0,0,0,.6)}
#mc{inset:12px 12px 0 12px; width:calc(100% - 24px); height:calc(100% - 12px); border-radius:6px 6px 0 0}
.monitor::after{inset:12px 12px 0 12px; border-radius:6px 6px 0 0}
.leds{top:3px}
.bezel{margin:calc(-1 * var(--ov)) 0 0 !important; padding:7px !important; border-radius:0 !important;
  background:linear-gradient(180deg,#f4f4f4,#9a9a9a 16%,#e6e6e6 45%,#7c7c7c 80%,#cfcfcf) !important;
  box-shadow:0 -6px 14px rgba(0,0,0,.55), 0 8px 14px rgba(0,0,0,.6) !important}
.reels{border-radius:4px}
.reel{border-radius:3px}

function shuffleStrip(list){
  for(let tries=0; tries<200; tries++){
    const a=[...list].sort(()=>Math.random()-.5);
    if(a.every((x,i)=>x!==a[(i+1)%a.length])) return a;
  }
  return list;
}

function setupMachine(){
  if(REACH_VIDEO[ans.m]) getVideo(REACH_VIDEO[ans.m]).load();

  reels = reelEls.map((el,i)=>{
    const order = shuffleStrip(base);

    strip.innerHTML = [0,1,2].map(()=>order.map(id=>`<div class="cell" data-id="${id}">${icon(id)}</div>`).join("")).join("");

    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const mx=W*.78, my=H*.22, mr=Math.min(W,H)*.11;
    const mg=ctx.createRadialGradient(mx,my,mr*.6,mx,my,mr*3.2); mg.addColorStop(0,"rgba(255,240,200,.35)"); mg.addColorStop(1,"rgba(255,240,200,0)");

  let pan = 0, jump = 0, boost = 0, t = 0, puffT = 0, puffs = [], last = 0;
  const ok = im=>im.complete && im.naturalWidth;
  // 右向きのトラック：左右反転し、荷台の広告だけ元の向きで貼りなおす（文字が鏡文字にならないように）
  let truckR = null;
  const truckRight = ()=>{
    if(truckR) return truckR;
    const w=truck.naturalWidth, h=truck.naturalHeight, c=document.createElement("canvas"); c.width=w; c.height=h;
    const x=c.getContext("2d"); x.save(); x.translate(w,0); x.scale(-1,1); x.drawImage(truck,0,0); x.restore();
    const a=.33, b=.945, tt=.06, bt=.70;
    x.drawImage(truck, w*a, h*tt, w*(b-a), h*(bt-tt), w*(1-b), h*tt, w*(b-a), h*(bt-tt));
    return (truckR=c);
  };
  const feather = im=>{   // 左はしを透明にぼかした版（前の景色に重ねて、つなぎ目をなめらかに）
    if(im.fe) return im.fe;
    const c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight;
    const x=c.getContext("2d"); x.drawImage(im,0,0); x.globalCompositeOperation="destination-in";
    const g=x.createLinearGradient(0,0,c.width,0); g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(OVERLAP,"#000"); g.addColorStop(1,"#000");
    x.fillStyle=g; x.fillRect(0,0,c.width,c.height); return (im.fe=c);
  };
  const aspect = sg=> ok(sg.im) ? sg.im.naturalWidth/sg.im.naturalHeight : 1.98;

  function draw(c, W, H, now, ovPx){
    const dt = Math.min(.05, last ? (now-last)/1000 : 0); last = now; t += dt;
    const visH = H - ovPx;                       // リールに隠れない部分
    const ih = Math.max(visH*.98, W/1.98);       // 景色の高さ
    const speed = ih*.22*(boost>0 ? 2.6 : 1);
    pan += speed*dt; boost = Math.max(0, boost-dt); jump = Math.max(0, jump-dt*1.7);

    // 景色（ずっとループ）
    const starts=[]; let u=0; segs.forEach(sg=>{ starts.push(u); u += aspect(sg)*ih*(1-OVERLAP); });
    const loopLen = u;
    c.fillStyle="#9cc3e6"; c.fillRect(0,0,W,H);
    const p = ((pan % loopLen)+loopLen)%loopLen;
    const vis=[];
    for(let rep=-1; rep<=1; rep++) segs.forEach((sg,i)=>{ const xl=starts[i]-p+rep*loopLen, w=aspect(sg)*ih; if(xl<W && xl+w>0) vis.push({sg,xl,w}); });
    vis.sort((a,b)=>a.xl-b.xl);
    vis.forEach((v,k)=>{ if(!ok(v.sg.im)) return; c.drawImage(k===0 ? v.sg.im : feather(v.sg.im), v.xl, 0, v.w, ih); });
    // 景色の下（リールの裏）は道路の色でつなぐ
    const gr=c.createLinearGradient(0,ih-2,0,H); gr.addColorStop(0,"#4a4d52"); gr.addColorStop(1,"#141518");
    c.fillStyle=gr; c.fillRect(0,ih-2,W,H-ih+2);

    // トラックの位置の道路の高さ（2枚が重なる所は間をとる）
    const tx = W*.44, TW = Math.min(W*.5, ih*.6), TH = TW*178/436;
    let road = .88, best=-1;
    vis.forEach(v=>{ const cx=tx-v.xl; if(cx>=0 && cx<=v.w){ const into=cx/(v.w*OVERLAP); if(best<0){ road=v.sg.road; best=1; } else road = road*(1-Math.min(1,into)) + v.sg.road*Math.min(1,into); } });
    const base = road*ih;
    const bob = Math.sin(t*22)*.8, jh = jump>0 ? Math.sin(jump*Math.PI)*TH*.75 : 0;
    const x = tx-TW/2, y = base-TH+bob-jh;

    // 影・スピード線・けむり
    const sl = 1-Math.sin(jump*Math.PI)*.45;
    c.fillStyle="rgba(0,0,0,.32)"; c.beginPath(); c.ellipse(tx, base+1, TW*.48*sl, 4*sl, 0, 0, 7); c.fill();
    if(boost>0){ c.strokeStyle=`rgba(255,255,255,${Math.min(1,boost)*.85})`; c.lineCap="round"; c.lineWidth=2.5;
      for(let k=0;k<5;k++){ const yy=y+TH*(.2+k*.16), l=30+((t*400+k*53)%50); c.beginPath(); c.moveTo(x-6-l,yy); c.lineTo(x-6,yy); c.stroke(); } }
    puffT -= dt;
    if(puffT<=0){ puffT = boost>0 ? .05 : .13; puffs.push({x:x+TW*.02, y:y+TH*.86, r:2.5, a:.45}); }
    puffs.forEach(q=>{ q.x -= (30+speed*.35)*dt; q.y -= 10*dt; q.r += 12*dt; q.a -= .55*dt; });
    puffs = puffs.filter(q=>q.a>0);
    puffs.forEach(q=>{ c.fillStyle=`rgba(235,235,235,${q.a})`; c.beginPath(); c.arc(q.x,q.y,q.r,0,7); c.fill(); });
    if(ok(truck)){
      c.save(); c.translate(x,y);
      if(jump>0){ c.translate(TW/2,TH); c.rotate(-Math.sin(jump*Math.PI)*.08); c.translate(-TW/2,-TH); }
      c.drawImage(truckRight(), 0, 0, TW, TH); c.restore();
    }
  }
  return { draw, jump(){ jump=1; boost=Math.max(boost,.7); }, dash(sec){ boost=Math.max(boost,sec); jump=1; } };
})();

function drawMonitor(now){
  if(!document.getElementById("s-play").classList.contains("active")) return;
  const dpr=Math.min(2, devicePixelRatio||1), w=monCv.clientWidth, h=monCv.clientHeight;
  if(!w) return;
  if(monCv.width!==Math.round(w*dpr) || monCv.height!==Math.round(h*dpr)){ monCv.width=Math.round(w*dpr); monCv.height=Math.round(h*dpr); }
  monCtx.setTransform(dpr,0,0,dpr,0,0);
  monCtx.save();
  if(monitorOverride) monitorOverride(monCtx,w,h);
  else Delivery.draw(monCtx, w, h, now, parseFloat(getComputedStyle($("#cab")).getPropertyValue("--ov"))||h*.3);
  monCtx.restore();
}

function loop(now){
  const dt = Math.min(.05,(now-last)/1000); last=now;
  reels.forEach((r,i)=>{
    if(r.state==="spin"){ r.v=Math.min(V_MAX, r.v+V_MAX*3*dt); r.offset-=r.v*dt; }
    else if(r.state==="stopping"){
      const a=r.anim, p=Math.min(1,(now-a.t0)/a.dur);
      r.offset = a.o0 - a.d*easeOutBack(p);
      if(p>=1){ r.offset=a.T; r.v=0; r.state="stopped"; onStopped(i); }
    }
  });
  if(reels.length) render();
  drawMonitor(now);
  requestAnimationFrame(loop);
}
function easeOutBack(x){ const c1=1.25, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); }

const busy = ()=> reels.some(r=>r.state!=="stopped") || reachLock;

function setButtons(){
  const spinning = reels.some(r=>r.state!=="stopped");
  $("#start").disabled = spinning || reachLock;
  $("#start").classList.toggle("live", !spinning && !reachLock);
  stopBtns.forEach((b,i)=>{
    const ok = reels[i] && reels[i].state==="spin" && reels[i].v>=V_MAX*.95 && !reachLock;
    b.disabled = !ok; b.classList.toggle("live", ok);
  });
}

$("#start").addEventListener("pointerdown", ()=>{

stopBtns.forEach((b,i)=>b.addEventListener("pointerdown", ()=>{

  press(b); buzz(15); Delivery.jump(); sfx.hop();

  if(pv && !pv.primed){ pv.primed = true; pv.muted = false; const pr = pv.play(); if(pr) pr.then(()=>{ pv.pause(); pv.currentTime = 0; }).catch(()=>{}); }
  const committed = reels.filter(x=>x.state!=="spin").length;   // すでに止めた（止めている）リール数
  const pred = targetFor(i, committed);
  // 現在位置から最低1コマ以上すべらせて、条件を満たす位置で止める
  const base = Math.floor(r.offset-1);
  let T = base;
  for(let k=0;k<L*2;k++){ if(pred(base-k)){ T=base-k; break; } }
  const d = r.offset - T;
  r.anim = {o0:r.offset, T, d, t0:performance.now(), dur: Math.min(900, Math.max(260, 2400*d/r.v/1.6))};
  r.state = "stopping";
  setButtons();
}));

function decideOutcome(){
  const M = MACHINES[ans.m];
  const pool = M.pool[ans.taste];
  const x = Math.random();
  if(x < RATE.rare) return {type:"hit", sym:RARE.id, rare:true};
  return {type:"hit", sym:pick(pool)};
}
function targetFor(i, committed){
  const r = reels[i], o = outcome;
  return T=>symAt(r,T)===o.sym;
}

async function onStopped(i){
  sfx.clunk(); buzz(12);
  const stopped = reels.map((r,k)=>r.state==="stopped"?k:-1).filter(k=>k>=0);
  setButtons();
  if(stopped.length===2){
    const [a,b] = stopped;
    if(symAt(reels[a],reels[a].offset)===symAt(reels[b],reels[b].offset)){
      // ===== リーチ！ =====
      const left = [0,1,2].find(k=>!stopped.includes(k));
      reachLock = true; setButtons();
      reels[left].el.classList.add("reach");
      $("#cab").classList.add("fever");
      setLCD("REACH!!", true);
      clearInterval(spinTicker);
      const rareReach = symAt(reels[a],reels[a].offset)===RARE.id;
      await new Promise(r=>setTimeout(r,500));
      await playReach(ans.m, rareReach);
      reachLock = false; setButtons();
      setLCD(rareReach ? "★ PREMIUM ★ STOPを押せ！" : "最後のSTOPを押せ！", true);
      spinTicker = setInterval(()=>sfx.tick(420+Math.random()*80,.02), 110);
    }
  }
  if(stopped.length===3){
    clearInterval(spinTicker);
    reelEls.forEach(e=>e.classList.remove("reach"));
    $("#cab").classList.remove("fever");
    const s = reels.map(r=>symAt(r,r.offset));
    if(s[0]===s[1] && s[1]===s[2]) win(s[0]);
    else setLCD("もう一回チャレンジ！");
  }
}

   リーチ演出（動画 or 内蔵アニメーション）

const videoCache = {};
function getVideo(src){
  if(videoCache[src]) return videoCache[src];
  const v = document.createElement("video");
  v.src = src; v.preload = "auto"; v.playsInline = true; v.setAttribute("playsinline","");
  v.style.cssText = "position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none";
  document.body.appendChild(v);
  return (videoCache[src] = v);
}
function drawReachText(c, w, h, ms, cy, rare){
  // 集中線
  c.save(); c.translate(w/2, cy);
  const R = Math.hypot(w,h), n = 46;
  for(let i=0;i<n;i++){
    const a = i/n*Math.PI*2 + Math.sin(i*7.3)*.04, len = R*(.55+.45*((i*37)%10)/10);
    c.strokeStyle = `rgba(255,255,255,${.10+.12*((i*13)%5)/5})`; c.lineWidth = 1.5+((i*7)%4);
    c.beginPath(); c.moveTo(Math.cos(a)*R*.28, Math.sin(a)*R*.28); c.lineTo(Math.cos(a)*len, Math.sin(a)*len); c.stroke();
  }
  c.restore();
  // 文字
  const p = Math.min(1, ms/320), sc = (3 - 2*easeOutBack(p)) * (1 + Math.sin(ms/90)*.025*(p>=1));
  const size = Math.min(w*.2, h*.34, 130);
  c.save(); c.translate(w/2 + (p<1?0:Math.sin(ms/23)*1.2), cy); c.scale(sc,sc); c.rotate(-.06);
  c.font = `900 ${size}px "Noto Sans JP", sans-serif`; c.textAlign="center"; c.textBaseline="middle";
  const g = c.createLinearGradient(0,-size/2,0,size/2);
  // 金色（上から：白っぽい金 → 濃い金 → 明るい帯 → 深い金）
  g.addColorStop(0,"#fffbe6"); g.addColorStop(.28,"#ffe27a"); g.addColorStop(.48,"#d9a21a");
  g.addColorStop(.52,"#fff1b0"); g.addColorStop(.75,"#e0a816"); g.addColorStop(1,"#8a5a00");
  c.lineJoin="round";
  c.lineWidth = size*.26; c.strokeStyle="#2a1600"; c.strokeText("リーチ!!",0,0);
  const rim = c.createLinearGradient(0,-size/2,0,size/2); rim.addColorStop(0,"#fff6cf"); rim.addColorStop(1,"#b8860b");
  c.lineWidth = size*.13; c.strokeStyle=rim; c.strokeText("リーチ!!",0,0);
  c.shadowColor = "#ffd34d"; c.shadowBlur = 34;
  c.fillStyle = g; c.fillText("リーチ!!",0,0);
  c.shadowBlur = 0; c.globalCompositeOperation = "lighter";   // きらっと光るハイライト
  const sh = c.createLinearGradient(-size*2,0,size*2,0), x = ((ms/700)%1.6)-.3;
  sh.addColorStop(clamp01(x-.08),"rgba(255,255,255,0)"); sh.addColorStop(clamp01(x),"rgba(255,255,255,.55)"); sh.addColorStop(clamp01(x+.08),"rgba(255,255,255,0)");
  c.fillStyle = sh; c.fillText("リーチ!!",0,0); c.globalCompositeOperation = "source-over";
  c.restore();
}

function playReach(m, rare){
  return new Promise(resolve=>{
    const box = $("#reach"), mon = $("#monitor"), cv = $("#rc"), ctx = cv.getContext("2d");
    const dpr = Math.min(2, devicePixelRatio||1);
    const INTRO = 1800, EXP = 600, FULL = rare ? 3200 : 2400, SHR = 550;  // ①モニターで「リーチ!!」＋トラック ②全画面へ ③ガチャ動画 ④モニターへ戻る
    const ease = x=>x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
    const parts = Array.from({length:90},()=>({x:Math.random(), y:Math.random(), r:1+Math.random()*4, s:.3+Math.random()*1.2, a:Math.random()*6.28, w:(Math.random()-.5)*2}));
    const t0 = performance.now();
    let shrinkAt = null, done = false, raf, video = null, videoStarted = false, curT = 0;
    const ovPx = ()=> parseFloat(getComputedStyle($("#cab")).getPropertyValue("--ov")) || 0;

    if(REACH_VIDEO[m]){ video = getVideo(REACH_VIDEO[m]); if(video.error) video = null; }
    const startVideo = ()=>{
      if(!video || videoStarted) return; videoStarted = true;
      video.currentTime = 0; video.muted = false;
      video.onended = ()=>{ if(shrinkAt===null) shrinkAt = performance.now(); };
      video.onerror = ()=>{ video = null; };
      video.play().catch(()=>{ if(!video) return; video.muted = true; video.play().catch(()=>{ video = null; }); });
    };

    // 描画：前半はトラックの映像＋「リーチ!!」、後半はガチャ動画（無ければ内蔵アニメ）
    const paint = (c,w,h,isMonitor)=>{
      const e = (shrinkAt!==null ? shrinkAt : performance.now()) - t0;
      if(e < INTRO+EXP){
        const ov = isMonitor ? ovPx() : ovPx()*(1-clamp01((e-INTRO)/EXP));
        Delivery.draw(c, w, h, performance.now(), ov);
        drawReachText(c, w, h, e, (h-ov)/2, rare);
        const fl = e<120 ? 1-e/120 : 0;
        if(fl>0){ c.fillStyle=`rgba(255,255,255,${fl})`; c.fillRect(0,0,w,h); }
        return;
      }
      if(video && video.readyState>=2 && video.videoWidth){
        const sc = Math.max(w/video.videoWidth, h/video.videoHeight), vw=video.videoWidth*sc, vh=video.videoHeight*sc;
        c.fillStyle="#000"; c.fillRect(0,0,w,h); c.drawImage(video,(w-vw)/2,(h-vh)/2,vw,vh); return;
      }
      if(video){ c.fillStyle="#000"; c.fillRect(0,0,w,h); return; }
      SCENES[m](c,w,h,curT,parts,rare);
      if(rare) goldBurst(c,w,h,curT);
    };

    mon.classList.add("live");
    monitorOverride = (c,w,h)=>paint(c,w,h,true);
    Delivery.dash(INTRO/1000);
    sfx.reach(rare);
    box.onclick = ()=>{ const e=performance.now()-t0; if(e > INTRO+EXP && shrinkAt===null) shrinkAt = performance.now(); };

    const setGeo = (k,r0)=>{
      const W = innerWidth, H = innerHeight;
      box.style.left   = r0.left*(1-k)+"px";
      box.style.top    = r0.top*(1-k)+"px";
      box.style.width  = r0.width+(W-r0.width)*k+"px";
      box.style.height = r0.height+(H-r0.height)*k+"px";
      box.style.borderRadius = 6*(1-k)+"px";
      box.classList.toggle("full", k>=1);
    };
    const finish = ()=>{
      if(done) return; done = true;
      cancelAnimationFrame(raf);
      if(video){ video.pause(); video.onended = null; }
      box.classList.remove("show","full"); mon.classList.remove("live");
      monitorOverride = null;
      resolve();
    };
    const frame = now=>{
      const e = now - t0;
      if(e >= INTRO+EXP) startVideo();
      if(shrinkAt===null && !video && e >= INTRO+EXP+FULL) shrinkAt = now;
      curT = clamp01((Math.min(e, shrinkAt!==null ? shrinkAt-t0 : e) - INTRO - EXP)/FULL);
      const r0 = $("#mc").getBoundingClientRect();
      let k;
      if(shrinkAt!==null){
        const p = clamp01((now-shrinkAt)/SHR);
        if(p>=1){ finish(); return; }
        k = 1-ease(p);
      } else k = e<INTRO ? -1 : ease(clamp01((e-INTRO)/EXP));

      if(k<0) box.classList.remove("show");
      else {
        box.classList.add("show"); setGeo(k, r0);
        const w = box.clientWidth, h = box.clientHeight;
        if(cv.width!==Math.round(w*dpr) || cv.height!==Math.round(h*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); }
        ctx.setTransform(dpr,0,0,dpr,0,0);
        ctx.save(); paint(ctx,w,h,false); ctx.restore();
      }
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  });
}
const clamp01 = x=>Math.max(0,Math.min(1,x));
const eOut = x=>1-Math.pow(1-x,3);

const SCENES = {
  // ビール：画面いっぱいにビールが注がれ、泡があふれる
  beer(ctx,W,H,t,parts){
    ctx.fillStyle="#0d0702"; ctx.fillRect(0,0,W,H);
    const lvl = H*(1-eOut(clamp01(t/.7))*.92);
    const g = ctx.createLinearGradient(0,lvl,0,H); g.addColorStop(0,"#ffd24f"); g.addColorStop(1,"#c96a00");
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=8) ctx.lineTo(x, lvl+Math.sin(x/38+t*18)*7);
    ctx.lineTo(W,H); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.7)";
    parts.forEach(p=>{ const y = H-((p.y*H + t*p.s*H*1.4)%H); if(y>lvl+10){ ctx.beginPath(); ctx.arc(p.x*W+Math.sin(t*10+p.a)*4, y, p.r*.7, 0, 7); ctx.fill(); }});
    // 泡
    const fh = 30+eOut(clamp01((t-.25)/.5))*70;
    ctx.fillStyle="#fffaf0";
    for(let x=-20;x<W+40;x+=34){ const y=lvl-fh*.4+Math.sin(x*.7+t*6)*6; ctx.beginPath(); ctx.arc(x, y, 26+Math.sin(x)*8, 0, 7); ctx.fill(); }
    ctx.fillRect(0, lvl-fh*.4, W, fh*.6);
  },
  // 日本酒：藍の夜に朱の筆が走り、桜が舞う
  sake(ctx,W,H,t,parts){
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#0b1a3d"); g.addColorStop(1,"#02040b");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="rgba(255,255,255,.05)"; for(let y=0;y<H;y+=6){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y+3); ctx.stroke(); }
    const p = eOut(clamp01((t-.04)/.3)), cy=H*.5, x1=W*.04+W*.92*p;
    for(let k=0;k<26;k++){
      ctx.strokeStyle=`rgba(${200+k%3*15},${30+k%5*6},${35},${.55+.02*k})`;
      ctx.lineWidth = 3+((k*37)%9); ctx.lineCap="round";
      const off=(k-13)*4.2;
      ctx.beginPath(); ctx.moveTo(W*.04, cy+off+Math.sin(k)*3);
      ctx.quadraticCurveTo((W*.04+x1)/2, cy+off-26*p, x1-((k*13)%30)*p, cy+off+18*p+Math.cos(k)*4); ctx.stroke();
    }
    parts.forEach(q=>{
      const y=((q.y*H + t*q.s*H*.9))%H, x=q.x*W+Math.sin(t*4+q.a)*30;
      ctx.save(); ctx.translate(x,y); ctx.rotate(q.a+t*q.w*6);
      ctx.fillStyle="rgba(255,190,205,.9)"; ctx.beginPath(); ctx.ellipse(0,0,q.r+3,q.r*.6+1.5,0,0,7); ctx.fill(); ctx.restore();
    });
  },
  // ワイン：深紅のうずとグラスの輝き
  wine(ctx,W,H,t,parts){
    ctx.fillStyle="#0c0105"; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    for(let k=0;k<4;k++){
      const a=t*5+k*1.57, R=Math.min(W,H)*(.25+.06*k);
      const x=W/2+Math.cos(a)*R*.5, y=H/2+Math.sin(a)*R*.5;
      const g=ctx.createRadialGradient(x,y,0,x,y,R*1.2);
      g.addColorStop(0,`rgba(${200-k*20},10,${50+k*10},.55)`); g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }
    parts.forEach(q=>{ const tw=(Math.sin(t*20+q.a*3)+1)/2; ctx.fillStyle=`rgba(255,215,140,${tw*.8})`;
      ctx.beginPath(); ctx.arc(q.x*W, q.y*H, q.r*.6*tw+.3, 0, 7); ctx.fill(); });
    ctx.globalCompositeOperation="source-over";
    // 波打つワインの水面
    const lvl = H*(1-.32*eOut(clamp01(t/.5)));
    const g=ctx.createLinearGradient(0,lvl,0,H); g.addColorStop(0,"#b0103c"); g.addColorStop(1,"#3a0010");
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=8) ctx.lineTo(x, lvl+Math.sin(x/60+t*10)*12);
    ctx.lineTo(W,H); ctx.fill();
  }
};
function goldBurst(ctx,W,H,t){
  ctx.save(); ctx.translate(W/2,H*.45); ctx.rotate(t*2);
  const n=18, R=Math.hypot(W,H);
  for(let i=0;i<n;i++){ ctx.rotate(Math.PI*2/n); ctx.fillStyle=i%2?"rgba(255,215,80,.28)":"rgba(255,245,200,.12)";
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(R,-R*.09); ctx.lineTo(R,R*.09); ctx.fill(); }
  ctx.restore();
}
function drawTitle(ctx,W,H,t,m,rare){
  const p = clamp01((t-.18)/.16);
  if(p<=0) return;
  const sc = 2.6 - 1.6*easeOutBack(p), shake = p<1?0:Math.sin(t*90)*1.5;
  const main = rare ? "激アツ" : ({beer:"REACH!", sake:"好機", wine:"CHANCE"})[m];
  const sub  = rare ? "PREMIUM REACH" : ({beer:"泡立つリーチ", sake:"リーチ", wine:"リーチ"})[m];
  const latin = /^[A-Z!]+$/.test(main);
  const size = Math.min(W*.24, H*.4, 150) * (latin?.9:1);
  ctx.save(); ctx.translate(W/2+shake, H*.45); ctx.scale(sc,sc); ctx.globalAlpha=clamp01(p*1.5);
  ctx.font = latin ? `700 ${size}px Oswald, sans-serif` : `800 ${size}px "Shippori Mincho B1", serif`;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  const gr = ctx.createLinearGradient(0,-size/2,0,size/2);
  if(rare){ gr.addColorStop(0,"#fffbe0"); gr.addColorStop(.5,"#ffd34d"); gr.addColorStop(1,"#b77905"); }
  else if(m==="beer"){ gr.addColorStop(0,"#fff"); gr.addColorStop(1,"#ffcf4a"); }
  else if(m==="sake"){ gr.addColorStop(0,"#fff"); gr.addColorStop(1,"#d7e4ff"); }
  else { gr.addColorStop(0,"#fff"); gr.addColorStop(1,"#ffc0cf"); }
  ctx.lineWidth = size*.1; ctx.strokeStyle = rare?"#5a2a00":(m==="beer"?"#5a2a00":m==="sake"?"#7a0f12":"#3d0012");
  ctx.shadowColor = rare?"#ffb300":"rgba(0,0,0,.8)"; ctx.shadowBlur = 30;
  ctx.strokeText(main,0,0); ctx.shadowBlur=0; ctx.fillStyle=gr; ctx.fillText(main,0,0);
  ctx.font = `900 ${Math.max(16,size*.2)}px "Noto Sans JP", sans-serif`;
  ctx.fillStyle="#fff"; ctx.globalAlpha=clamp01((t-.3)/.1);
  ctx.fillText(sub, 0, size*.78);
  ctx.restore();
}

/* =================================================================
   効果音（外部ファイル不要）・振動・紙吹雪
   ================================================================= */
const sfx = (()=>{
  let ac=null;
  const ctx=()=>{ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); }catch(e){ ac=null; } return ac; };
  const tone=(f,dur,vol,type="square",when=0,slide=0)=>{ const a=ac; if(!a) return;
    const o=a.createOscillator(), g=a.createGain(), t=a.currentTime+when;
    o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02); };
  return {
    ctx, tick:(f,v)=>tone(f,.04,v),
    lever:()=>{ tone(180,.12,.12,"sawtooth",0,90); tone(900,.08,.06,"square",.05); },
    clunk:()=>{ tone(140,.09,.18,"triangle"); tone(70,.12,.12,"sine"); },
    reach:rare=>{ const n=rare?[523,659,784,1047,1319,1568]:[392,494,587,784]; n.forEach((f,i)=>tone(f,.22,.08,"square",i*.13)); if(rare) tone(110,1.6,.08,"sawtooth",.1,220); },
    fanfare:rare=>{ const n=rare?[784,988,1175,1568,1175,1568,2093]:[784,988,1175,1568]; n.forEach((f,i)=>tone(f,.2,.08,"square",i*.11)); tone(392,.9,.05,"triangle",n.length*.11); },
    hop:()=>{ tone(420,.12,.07,"triangle",0,880); },
    miss:()=>{ tone(330,.25,.08,"triangle",0,220); tone(247,.35,.08,"triangle",.22,160); },
  };
})();
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
function confetti(n){
  const cols=["#ffd34d","#ff6b8b","#8fb8ff","#ffffff","#7ee0a1"];
  for(let i=0;i<n;i++){
    const s=document.createElement("div"); s.className="sparkle";
    s.style.left=Math.random()*100+"vw"; s.style.top="-20px"; s.style.background=pick(cols);
    s.style.animationDuration=1.6+Math.random()*1.6+"s"; s.style.animationDelay=Math.random()*.5+"s";
    document.body.appendChild(s); setTimeout(()=>s.remove(),4000);
  }
}
